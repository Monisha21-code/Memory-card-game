<!DOCTYPE html>
<html>

<head>


    <title>Profile - Memory Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="logo">
            🧠 Memory Game
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="game.html">
                Play Game
            </a>

            <a href="profile.html">
                Profile
            </a>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <main class="profile-container">


        <div class="profile-card">

            <div class="profile-icon">
                👤
            </div>


            <h1>
                My Profile
            </h1>


            <label>
                Name
            </label>

            <input
                type="text"
                id="profileName"
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="profileEmail"
            >


            <div class="profile-coins">

                🪙

                <strong id="profileCoins">
                    50
                </strong>

                Coins

            </div>


            <div class="profile-stats">

                <div>

                    <strong id="profileWins">
                        0
                    </strong>

                    <span>
                        Games Won
                    </span>

                </div>


                <div>

                    <strong id="profileGames">
                        0
                    </strong>

                    <span>
                        Games Played
                    </span>

                </div>

            </div>


            <button onclick="updateProfile()">
                Save Changes
            </button>


        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
